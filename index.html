<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <div class="header-row">
      <h1>待辦清單</h1>
      <!-- 深色模式切換按鈕，圖示與文字會依目前主題動態更新 -->
      <button id="theme-toggle" class="theme-toggle" type="button">
        <span id="theme-toggle-icon">🌙</span>
        <span id="theme-toggle-text">深色模式</span>
      </button>
    </div>

    <!-- 輸入區：文字輸入框 + 新增按鈕 -->
    <form id="todo-form" class="input-row">
      <input
        type="text"
        id="todo-input"
        placeholder="輸入待辦事項..."
        autocomplete="off"
      />
      <button type="submit">新增</button>
    </form>

    <!-- 篩選按鈕：全部 / 未完成 / 已完成 -->
    <div class="filter-row" id="filter-row">
      <button class="filter-btn active" type="button" data-filter="all">全部</button>
      <button class="filter-btn" type="button" data-filter="active">未完成</button>
      <button class="filter-btn" type="button" data-filter="completed">已完成</button>
    </div>

    <!-- 待辦事項清單 -->
    <ul id="todo-list" class="todo-list"></ul>

    <!-- 清單為空時顯示的提示文字 -->
    <p id="empty-message" class="empty-message">還沒有任何待辦事項,新增一個吧!</p>

    <!-- 底部統計未完成數量 -->
    <footer class="footer">
      <span id="remaining-count">未完成:0 項</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
